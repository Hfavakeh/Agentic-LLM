services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"          # optional: expose to host for `ollama pull`
    volumes:
      - ollama-models:/root/.ollama   # persist pulled models across restarts
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  app:
    build: .
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: "http://ollama:11434"   # autogen/ollama client reads this
    volumes:
      # Live-mount the source tree over the image's /app so CODE changes need NO
      # rebuild — `git pull` then `docker compose run --rm app ...` picks them up.
      # (The image still COPYs the code at build time as a fallback; this mount
      # shadows it at runtime.)
      - .:/app
      # Persist experiment outputs to the host. Pass `--output outputs/<name>`
      # so results land here (the default --output writes to /app and is lost
      # when the container is removed). More specific than `.:/app`, so this
      # subdir mount wins for outputs/.
      - ./outputs:/app/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Override the default `python main.py` with run-specific flags, e.g.:
    #   docker compose run --rm app --model qwen3:8b --rounds 10 --output outputs/run1
    # command: ["--smoke-test"]

volumes:
  ollama-models:
